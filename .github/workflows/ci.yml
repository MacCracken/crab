name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:   # reusable: release.yml gates on this CI workflow

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4 (pinned — CVE-21)

      - name: Install Cyrius toolchain
        # The cyrius.cyml [package].cyrius pin is the single source of
        # truth for the toolchain version — never hardcode it here. Read
        # the pin and hand it to the canonical upstream installer, which
        # fetches + lays out $HOME/.cyrius/{bin,lib}. Do NOT hand-roll
        # curl+tar+cp — scripts/install.sh is the supported entry point
        # (matches patra / sigil).
        run: |
          set -e
          CYRIUS_VERSION="$(grep '^cyrius = ' cyrius.cyml | head -1 | sed 's/cyrius = "\(.*\)"/\1/')"
          echo "Installing Cyrius $CYRIUS_VERSION"
          curl -sSf https://raw.githubusercontent.com/MacCracken/cyrius/main/scripts/install.sh | \
            CYRIUS_VERSION="$CYRIUS_VERSION" sh
          echo "$HOME/.cyrius/bin" >> "$GITHUB_PATH"

      - name: Resolve dependencies
        # ⭐ `--locked` (cyrius 6.7.6) resolves every tag, writes NOTHING, and fails naming each
        # difference between what the tags resolve and the committed `lib/` + `cyrius.lock`.
        # ⛔ It replaced `cyrius deps` here at 0.11.0 because that one REWROTE a stale lock and then
        # `--verify` passed against the rewrite — measured on 6.7.9: the 0.10.5 lock under the 0.11.0
        # manifest went green (40 verified, 0 failed) while `--locked` refused it, rc=1, naming eight
        # missing commit pins. A tampered pin is refused too. `--verify` stays as a second, independent
        # hash check of `lib/` against the lock.
        run: |
          set -e
          cyrius deps --locked
          cyrius deps --verify

      - name: Build (host)
        # ⭐ `CYRIUS_DCE=1` on both target builds since 0.10.3 (operator ruling 2026-09-21), because
        # `release.yml` ships DCE binaries and this workflow is its gate: the `build/crab` the suite
        # spawns and the `--agnos` binary the QEMU harnesses take must be the artifact that ships,
        # not a plain twin of it. `render_test` below stays plain — it is a harness, not the artifact
        # (measured under DCE too: 55 checks, 0 failed).
        run: |
          mkdir -p build
          CYRIUS_DCE=1 cyrius build src/main.cyr build/${{ github.event.repository.name }}

      - name: Build (--agnos — the target that actually ships)
        # ⛔⛔ THIS STEP IS NOT A TIDINESS ITEM. `src/main.cyr` wraps lines 263–1484 in a
        # single `#ifdef CYRIUS_TARGET_AGNOS` with **no `#else`** — 1,221 of 1,494 lines, including
        # the whole key-dispatch table. The host build above does not compile ONE of them, so a
        # brace error there goes green through the host step and fails only here. That happened at
        # 0.7.5. It also caught a broken dependency graph on 2026-08-27: against the declared
        # dhancha 0.9.17, host PASSED and `--agnos` failed with `undefined variable 'POINTER_SCROLL'`.
        # ⛔ THE FLAG IS `--agnos`. `CYRIUS_TARGET=agnos` is SILENTLY IGNORED — measured: it builds a
        # byte-identical HOST binary and exits 0, with no warning, even for a garbage value. A step
        # written that way would look like this gate and be the host build twice.
        run: CYRIUS_DCE=1 cyrius build --agnos src/main.cyr build/crab-agnos

      - name: Test
        # ⭐ Since cyrius 6.6.17 `cyrius test` RUNS the `[build].test` entry as well as auto-discovering
        # `tests/*.tcyr` — measured on 6.6.20: pointing it at a file that fails turns this step red
        # (rc=1). `test = "tests"` names the directory the walk already covers; each `.tcyr` runs once.
        # ⚠ It needs `build/` and `build/crab` to exist — 134 assertions write fixtures into a
        # relative `build` dir and one hard-codes `build/crab` — which the host build above provides.
        run: cyrius test

      - name: render_test — the pixel assertions
        # ⛔⛔ THIS IS crab's STRONGEST TEST. It is the only enforcement of the rule
        # that the render path (`src/ui.cyr`) must never call up into `src/app.cyr` — a rule the
        # source records being broken four or five times. Nothing discovers it: `cyrius test` runs
        # `tests/*.tcyr` and the `[build].test` entry (`tests`), and this file is neither, so these
        # checks ran under no gate while catching mutations the suite missed — until this step.
        # ⚠ ITS EXIT CODE IS THE ASSERTION — it returns the number of failed checks. Verified by
        # injecting a bad check: `54 checks, 1 failed`, exit 1. It also prints its own count, so a
        # run that silently executed zero checks is visible; it used to exit 0 either way.
        # ⛔⛆ AND THE BUILD'S EXIT CODE IS ONLY HALF THE GATE — MEASURED, 0.9.4. An undefined
        # **constant** from an up-call is `error:` and fails the build (that is what caught 0.9.3).
        # An undefined **function** is only `warning:`, and the build exits 0: planting
        # `crab_exif_raw_buf()` (an app.cyr function) into `crab_tc_claim` in ui.cyr compiled OK and
        # ran `53 checks, 0 failed`. So for five years the rule this step claims to enforce was
        # enforced for enums and NOT for functions — the more likely mistake of the two.
        # ⇒ The warning IS the gate. Fail on it.
        run: |
          set -e
          # ⛔ `cmd | tee` HIDES cmd's EXIT STATUS — a pipeline's status is the LAST stage's, so
          # `set -e` would not fire on a failed build and the step would go on to run a STALE
          # binary and report its old count as green. Caught doing exactly that while writing this.
          # ⇒ Redirect to a file and check the status directly.
          cyrius build src/render_test.cyr build/render_test > /tmp/rt.build 2>&1 || {
            echo "::error::render_test failed to BUILD"; cat /tmp/rt.build; exit 1; }
          cat /tmp/rt.build
          if grep -q "undefined function" /tmp/rt.build; then
            echo "::error::src/ui.cyr calls UP into src/app.cyr — the render path may not do that."
            grep "undefined function" /tmp/rt.build
            exit 1
          fi
          ./build/render_test

      - name: Fuzz
        # ⚠ 100,000 deterministic rounds from a fixed seed, and it prints the number it really drove
        # so this step cannot agree with a stale claim about itself.
        run: cyrius fuzz

      - name: Format check
        # ⚠ THE LOOP IS LOAD-BEARING. `cyrius fmt --check` takes ONE FILE per invocation (as does
        # `cyrius lint`), so `cyrius fmt --check src/*.cyr` would check `src/app.cyr` alone and pass
        # green while the other eight rotted. Enumerate, one invocation each.
        run: |
          set -e
          for f in src/*.cyr tests/crab.tcyr tests/crab.fcyr tests/crab.bcyr; do
            cyrius fmt --check "$f"
          done

      - name: Coverage floor
        # ⚠ REFERENCE coverage — a floor, not a correctness proof, and the tool says so itself.
        # The v1.0 criterion is 80%; the floor sits two points under the measurement, so it gates with
        # headroom rather than being a rubber stamp: 82 against a measured 84% (347/413 on cyrius
        # 6.6.20 and 6.7.9, `render_test` in the corpus via `[coverage] programs`). It was 85 against
        # 87% until cyrius 6.6.8 made the tool honest — it now reads `public fn` and whole files, and
        # crab's ui.cyr + app.cyr had hidden 49 fns past its old 256 KiB buffer — so the same tree
        # read 82%.
        # Verified it can fail: `--min 85` exits 1 with `coverage gate FAILED`.
        run: cyrius coverage --min 82

      - name: Static checks
        run: |
          set -e
          cyrius vet src/main.cyr
          cyrius deny src/main.cyr

      # ⛔ WHAT THIS WORKFLOW DELIBERATELY DOES **NOT** RUN, so the omissions are decisions rather
      # than oversights:
      #   - `cyrius bench` — the harness is real and measures the sort, but a timing on a shared
      #     runner is noise, and a step that cannot fail is not a gate. It is run locally, and
      #     `docs/benchmarks.md` is where its numbers belong — see the roadmap's 0.7.8 batch.
      #   - `cyrius lint` — exits 0 no matter what it finds, so it CANNOT gate. `cyrius lint --strict`
      #     does (exit 2), but it fails today on 83 pre-existing over-long lines — 14 in
      #     `src/main.cyr`, 58 in `tests/crab.tcyr`, 11 in `tests/crab.fcyr` (85 lint warnings in
      #     all, counting 2 consecutive-blank-line hits). Turning it on means reformatting the
      #     event loop — the widest mechanical edit in the most sensitive file — and that is its
      #     own change, not a rider on this one — see the roadmap's 0.8.0 batch.
      #   - `cyrius audit` — bundles lint+test+bench and therefore exits 1 on those same lint
      #     warnings. It becomes usable here the day `--strict` does.
