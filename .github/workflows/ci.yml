name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:   # reusable: release.yml gates on this CI workflow

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4 (pinned — CVE-21)

      - name: Install Cyrius toolchain
        # The cyrius.cyml [package].cyrius pin is the single source of
        # truth for the toolchain version — never hardcode it here. Read
        # the pin and hand it to the canonical upstream installer, which
        # fetches + lays out $HOME/.cyrius/{bin,lib}. Do NOT hand-roll
        # curl+tar+cp — scripts/install.sh is the supported entry point
        # (matches patra / sigil).
        run: |
          set -e
          CYRIUS_VERSION="$(grep '^cyrius = ' cyrius.cyml | head -1 | sed 's/cyrius = "\(.*\)"/\1/')"
          echo "Installing Cyrius $CYRIUS_VERSION"
          curl -sSf https://raw.githubusercontent.com/MacCracken/cyrius/main/scripts/install.sh | \
            CYRIUS_VERSION="$CYRIUS_VERSION" sh
          echo "$HOME/.cyrius/bin" >> "$GITHUB_PATH"

      - name: Resolve dependencies
        run: cyrius deps

      - name: Build
        run: |
          mkdir -p build
          cyrius build src/main.cyr build/${{ github.event.repository.name }}

      - name: Test
        # ⛔⛔ THIS COMMENT USED TO SAY `cyrius test` "picks up the [build].test entry AND
        # auto-discovers tests/*.tcyr". THE FIRST HALF IS FALSE, and it mattered: it told every
        # reader that src/test.cyr was a live gate. MEASURED 2026-09-01 on the pinned 6.5.36 by
        # mutation — src/test.cyr rewritten to `return 1` in a scratch tree left this step at
        # **1138 passed, 0 failed, exit 0**. Only tests/crab.tcyr is compiled and run.
        # ⇒ [build].test is inert, not a gate (*deferrals #17, #40*). src/test.cyr's own header
        # comment is the accurate one.
        # ⚠ AND THIS STEP IS THE WHOLE AUTOMATED GATE: no --agnos build (*#15*), no render_test
        # and its 53 pixel checks (*#14*), no fuzz/bench/lint/fmt/coverage (*#36*).
        run: cyrius test
